# ============================================================================
# haproxy.cfg — endurecido para jarvis-tools
# ----------------------------------------------------------------------------
# Sustituye la config por defecto de tecnativa/docker-socket-proxy, cuya ACL
# de CONTAINERS=1 es un match de PREFIJO:
#
#   http-request allow if { path ^(/v[\d\.]+)?/containers } { env(CONTAINERS) }
#
# Eso permite tambien GET /containers/{id}/json (inspect), que devuelve
# Config.Env: TOKENS, API KEY y hash de contrasena de los otros contenedores.
#
# Aqui la ACL es por endpoint exacto. Lo unico permitido es lo que
# jarvis-tools usa realmente (ver tools/app/docker_api.py):
#
#   GET /version              -> negociacion de version del SDK de Docker
#   GET /_ping                -> health del cliente
#   GET /containers/json      -> listar contenedores
#   GET /containers/{n}/logs  -> tool docker_logs
#   GET /containers/{n}/stats -> tool docker_stats
#
# Todo lo demas responde 403. En particular:
#   GET  /containers/{n}/json  (inspect) -> 403  (fuga de Config.Env)
#   POST cualquier ruta                    -> 403  (toda mutacion)
#   /info /images /volumes /exec /events   -> 403
# ============================================================================

global
    log stdout format raw daemon "${LOG_LEVEL}"
    pidfile /run/haproxy.pid
    maxconn 4000
    server-state-file /var/lib/haproxy/server-state

defaults
    mode http
    log global
    option httplog
    option dontlognull
    option http-server-close
    option redispatch
    retries 3
    timeout http-request 10s
    timeout queue 1m
    timeout connect 10s
    timeout client 10m
    timeout server 10m
    timeout http-keep-alive 10s
    timeout check 10s
    maxconn 3000

    load-server-state-from-file global

    errorfile 403 /usr/local/etc/haproxy/errors/403.http

backend dockerbackend
    server dockersocket /var/run/docker.sock

frontend dockerfrontend
    bind :2375

    # La API de Docker solo muta estado con POST/PUT/DELETE.
    # GET no produce efectos: cortamos aqui todo lo que no sea GET.
    http-request deny unless METH_GET

    # --- Permitidos (minimo estricto) ---
    http-request allow if { path,url_dec -m reg -i ^(/v[0-9.]+)?/version$ }
    http-request allow if { path,url_dec -m reg -i ^(/v[0-9.]+)?/_ping$ }
    http-request allow if { path,url_dec -m reg -i ^(/v[0-9.]+)?/containers/json$ }
    http-request allow if { path,url_dec -m reg -i ^(/v[0-9.]+)?/containers/[a-zA-Z0-9_.-]+/logs$ }
    http-request allow if { path,url_dec -m reg -i ^(/v[0-9.]+)?/containers/[a-zA-Z0-9_.-]+/stats$ }

    # Denegado por omision: incluye /containers/{id}/json (inspect),
    # /info, /images, /volumes, /exec, /events y cualquier escritura.
    http-request deny

    default_backend dockerbackend
