# ============================================================================
# Jarvis Stack — Single compose for everything
# ----------------------------------------------------------------------------
# Services:
#   docker-socket-proxy → ACLs sobre la API Docker. Único mount de docker.sock
#                         (junto a portainer, que necesita la API completa).
#   jarvis-tools        → solo lectura, via el proxy. NO ve docker.sock.
#   jarvis-agent        → cerebro (FastAPI + LangGraph + SQLite), no Docker socket
#   portainer           → Docker management UI (moved off EOL image later)
#   filebrowser         → NAS file browser (root = /mnt/data/nas/files)
#
# All persistent data lives under /mnt/data (the external 698 GB disk).
# Exposed via Tailscale Serve (host-level), not Docker ports.
# ============================================================================
name: jarvis

services:
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    container_name: docker-socket-proxy
    restart: unless-stopped
    # Config propia con ACLs por endpoint exacto. La de la imagen usa
    # CONTAINERS=1 (match de prefijo) y permite GET /containers/{id}/json,
    # que devuelve Config.Env con los secretos de los otros contenedores.
    command: ["haproxy", "-f", "/usr/local/etc/haproxy/jarvis-haproxy.cfg"]
    environment:
      # haproxy no acepta "error" como nivel syslog: los validos son
      # emerg/alert/crit/err/warning/notice/info/debug.
      LOG_LEVEL: err
      SOCKET_PATH: /var/run/docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./deploy/docker-socket-proxy/haproxy.cfg:/usr/local/etc/haproxy/jarvis-haproxy.cfg:ro
    networks:
      - dsp
    security_opt:
      - no-new-privileges:true

  jarvis-tools:
    build: ./tools
    image: jarvis-tools:0.1
    container_name: jarvis-tools
    restart: unless-stopped
    depends_on:
      docker-socket-proxy:
        condition: service_started
    environment:
      JARVIS_TOOLS_TOKEN: ${JARVIS_TOOLS_TOKEN:?define JARVIS_TOOLS_TOKEN en .env}
      # Se habla con el proxy, no con el socket. El proxy filtra por ACL.
      JARVIS_DOCKER_HOST: tcp://docker-socket-proxy:2375
      JARVIS_DOCKER_API_VERSION: "1.45"
    volumes:
      - /proc/device-tree/model:/etc/board-model:ro
    expose:
      - "8000"
    networks:
      - jarvis
      - dsp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen(\"http://127.0.0.1:8000/health\",timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  jarvis-executor:
    build: ./executor
    image: jarvis-executor:0.5
    container_name: jarvis-executor
    restart: unless-stopped
    environment:
      JARVIS_EXECUTOR_TOKEN: ${JARVIS_EXECUTOR_TOKEN:?define JARVIS_EXECUTOR_TOKEN en .env}
      JARVIS_EXECUTOR_APPROVALS_TOKEN: ${JARVIS_EXECUTOR_APPROVALS_TOKEN:?define JARVIS_EXECUTOR_APPROVALS_TOKEN en .env}
      JARVIS_EXECUTOR_HOSTS_FILE: /app/config/hosts.yml
      JARVIS_EXECUTOR_CATALOG_FILE: /app/config/catalog.yml
      JARVIS_EXECUTOR_SSH_DIR: /app/ssh
      JARVIS_EXECUTOR_AUDIT_DB: /data/audit.db
      # asyncssh necesita un usuario local para resolver rutas con '~'.
      USER: jarvis
      LOGNAME: jarvis
      HOME: /tmp
    volumes:
      - /mnt/data/docker/executor_data:/data
      # Claves SSH privadas y known_hosts: solo lectura, nunca salen del disco.
      - /mnt/data/docker/executor_ssh:/app/ssh:ro
      - ./executor/config:/app/config:ro
      # Raices autorizadas del host 'kickpi' (visibles dentro del contenedor)
      - /mnt/data/nas:/mnt/data/nas:ro
      - /home/leandro/jarvis:/home/leandro/jarvis:ro
    expose:
      - "8000"
    networks:
      - jarvis
    security_opt:
      - no-new-privileges:true
    # Sin root, sin capacidades, sistema de ficheros de solo lectura.
    user: "1000:1000"
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen(\"http://127.0.0.1:8000/health\",timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  jarvis-agent:
    build: ./agent
    image: jarvis-agent:0.9
    container_name: jarvis-agent
    restart: unless-stopped
    depends_on:
      jarvis-tools:
        condition: service_healthy
    environment:
      JARVIS_API_TOKEN: ${JARVIS_API_TOKEN:?define JARVIS_API_TOKEN en .env}
      JARVIS_TOOLS_TOKEN: ${JARVIS_TOOLS_TOKEN:?define JARVIS_TOOLS_TOKEN en .env}
      JARVIS_TOOLS_URL: http://jarvis-tools:8000
      JARVIS_EXECUTOR_TOKEN: ${JARVIS_EXECUTOR_TOKEN:?define JARVIS_EXECUTOR_TOKEN en .env}
      JARVIS_APPROVALS_TOKEN: ${JARVIS_APPROVALS_TOKEN:?define JARVIS_APPROVALS_TOKEN en .env}
      JARVIS_EXECUTOR_URL: http://jarvis-executor:8000
      # Proxy same-origin de FileBrowser: /files/* → contenedor filebrowser.
      JARVIS_FILEBROWSER_URL: http://filebrowser:8080
      JARVIS_LLM_BASE_URL: ${JARVIS_LLM_BASE_URL:-https://openrouter.ai/api/v1}
      JARVIS_LLM_API_KEY: ${JARVIS_LLM_API_KEY:-}
      JARVIS_LLM_MODEL: ${JARVIS_LLM_MODEL:-nvidia/nemotron-3-super-120b-a12b:free}
      JARVIS_LLM_FALLBACK_MODELS: "${JARVIS_LLM_FALLBACK_MODELS:-minimax/minimax-m3.1-flash:free,google/gemma-4-26b-a4b-it:free,openrouter/free}"
      JARVIS_MAX_TOOL_ITERATIONS: ${JARVIS_MAX_TOOL_ITERATIONS:-10}
      JARVIS_ADMIN_PASSWORD_HASH: ${JARVIS_ADMIN_PASSWORD_HASH:-}
      JARVIS_SESSION_TTL_DAYS: ${JARVIS_SESSION_TTL_DAYS:-30}
      JARVIS_COOKIE_SECURE: ${JARVIS_COOKIE_SECURE:-true}
    volumes:
      - /mnt/data/docker/jarvis_data:/data
      # PWA servida desde el host: actualizar el build es `rsync` y listo,
      # sin reconstruir la imagen del agente.
      - ./agent/static:/app/static:ro
    ports:
      - "127.0.0.1:8888:8000"
    networks:
      - jarvis
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen(\"http://127.0.0.1:8000/health\",timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  portainer:
    image: portainer/portainer-ce:lts
    container_name: portainer
    restart: unless-stopped
    command: -H unix:///var/run/docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /mnt/data/docker/portainer:/data
    # Tailscale Serve proxya a https://127.0.0.1:9443 en el HOST, asi que el
    # puerto debe estar publicado (bound a loopback, nunca a la red).
    ports:
      - "127.0.0.1:9443:9443"
    networks:
      - jarvis
    security_opt:
      - no-new-privileges:true

  filebrowser:
    # Upstream filebrowser/filebrowser esta ARCHIVADO (sin parches de seguridad).
    # Quantum v1.5.8 es el fork mantenido y conserva BoltDB, asi que la
    # migracion es sin perdida de usuarios ni contrasena.
    image: gtstef/filebrowser:1.5.8-stable-slim
    container_name: filebrowser
    restart: unless-stopped
    environment:
      FILEBROWSER_CONFIG: /home/filebrowser/data/config.yaml
      FILEBROWSER_DATABASE: /home/filebrowser/data/database.db
    volumes:
      - /mnt/data/docker/filebrowser/data:/home/filebrowser/data
      - /mnt/data/nas/files:/srv
    # Tailscale Serve proxya a http://127.0.0.1:8080 en el HOST.
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - jarvis
    security_opt:
      - no-new-privileges:true
    # El HEALTHCHECK de la imagen apunta a /health en el puerto 80, pero la
    # app escucha en 8080 con baseURL /files.
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/files/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

networks:
  jarvis:
    driver: bridge
  # Red interna dedicada al proxy: sin salida a internet y sin acceso desde
  # fuera del compose. Solo la comparten el proxy y jarvis-tools.
  dsp:
    driver: bridge
    internal: true

# No named volumes — everything is bind-mounted to /mnt/data
