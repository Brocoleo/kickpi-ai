# ============================================================================
# Registro de hosts y proyectos — Jarvis Executor
# ----------------------------------------------------------------------------
# Las direcciones son las REALES de la tailnet (verificadas con `tailscale
# status` el 2026-10-20). NO se inventan IPs.
#
#   kickpi   100.111.200.54  (este servidor; el ejecutor corre aqui)
#   macbook  100.126.29.56  (leandro-MacBookPro, Ubuntu 24.04)
#   desktop  (PC Xeon, Linux Mint) -> NO aparece en la tailnet todavia.
#            Queda deshabilitado hasta que el equipo entre en la red y se
#            configure su direccion real.
#
# `roots` es la lista de directorios autorizados por host. El Policy Engine
# resuelve la ruta REAL en el host destino (sigue symlinks) y exige que caiga
# dentro de una de estas raices.
# ============================================================================
version: 1

hosts:
  - id: kickpi
    label: "KICKPI K2B (este servidor)"
    transport: local
    enabled: true
    os: "Debian 13 (ARM64)"
    roots:
      - /mnt/data/nas
      - /home/leandro/jarvis

  - id: macbook
    label: "MacBook Pro (Ubuntu 24.04)"
    transport: ssh
    enabled: true
    address: 100.126.29.56
    port: 22
    # Usuario de sistema DEDICADO. Su authorized_keys lleva un forced
    # command (jarvis-ssh-wrapper): la clave del ejecutor NO da shell, solo
    # permite el catalogo autorizado dentro de las raices autorizadas.
    user: jarvis
    os: "Ubuntu 24.04 (x86_64)"
    identity_file: /app/ssh/id_ed25519_macbook
    known_hosts: /app/ssh/known_hosts_macbook
    roots:
      - /home/leandro/kickpi-ai
      - /home/leandro/Documentos/ChatGPT/React Native/apostol
      - /home/leandro/camera-facetime

  - id: desktop
    label: "PC Xeon (Linux Mint)"
    transport: ssh
    enabled: false
    address: null
    port: 22
    user: leandro
    os: "Linux Mint"
    identity_file: /app/ssh/id_ed25519_desktop
    known_hosts: /app/ssh/known_hosts_desktop
    roots: []

# ----------------------------------------------------------------------------
# Proyectos autorizados. `test_command` es la suite REAL de cada repo.
# ----------------------------------------------------------------------------
projects:
  - id: apostol
    label: "apostol (React Native + Node test runner)"
    host: macbook
    path: "/home/leandro/Documentos/ChatGPT/React Native/apostol"
    # Rutas absolutas: la suite se ejecuta con independencia del directorio
    # de trabajo de la sesion SSH.
    test_command:
      - node
      - --test
      - "/home/leandro/Documentos/ChatGPT/React Native/apostol/server/bible-reader.test.mjs"
      - "/home/leandro/Documentos/ChatGPT/React Native/apostol/server/bible-supplement.test.mjs"
      - "/home/leandro/Documentos/ChatGPT/React Native/apostol/server/auth.test.mjs"
      - "/home/leandro/Documentos/ChatGPT/React Native/apostol/server/stream.test.mjs"
      - "/home/leandro/Documentos/ChatGPT/React Native/apostol/src/lib/liturgia.test.mjs"
    enabled: true

  - id: jarvis
    label: "kickpi-ai (repo de Jarvis)"
    host: macbook
    path: "/home/leandro/kickpi-ai"
    test_command: null
    enabled: true
