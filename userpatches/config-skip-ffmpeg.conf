# Workaround bug upstream kickpi-k2b-v2 + ffmpeg-v4l2-request en main:
# extensions/ffmpeg-v4l2-request.sh:59 hace `declare -g PACKAGE_LIST_BOARD+=...`
# pero PACKAGE_LIST_BOARD ya es readonly desde kickpi-k2b-v2.csc -> build falla.
# El propio extension documenta SKIP_FFMPEG_V4L2=yes para compilar sin el pack prebuilt.
# Esto solo quita FFmpeg HW prebuilt (~40MB); el resto minimal queda igual.
SKIP_FFMPEG_V4L2=yes
